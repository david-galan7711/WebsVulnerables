# Endurecimiento del servidor para la version segura de Mordor.
# El directorio de subidas no puede ejecutar ningun tipo de script.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/private/uploads>
    Options -ExecCGI -Indexes
    AllowOverride None

    RemoveHandler .php .php3 .php4 .php5 .php7 .php8 .phtml .phar .phps
    RemoveType .php .php3 .php4 .php5 .php7 .php8 .phtml .phar .phps

    <FilesMatch "\.(php|php[0-9]|phtml|phar|phps|cgi|pl|py|jsp|asp|aspx|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
