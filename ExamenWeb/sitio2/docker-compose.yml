name: mordor_fixed

services:
  db2:
    image: mysql:8.0
    container_name: mysql_mordor_fixed
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_examen2
      MYSQL_DATABASE: mordor
    volumes:
      - mordor_fixed_db:/var/lib/mysql
      - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web2:
    build: .
    container_name: web_mordor_fixed
    restart: unless-stopped
    ports:
      - "54351:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db2

volumes:
  mordor_fixed_db:
